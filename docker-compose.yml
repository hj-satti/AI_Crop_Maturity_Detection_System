services:

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile

    container_name: crop-maturity-backend

    ports:
      - "8080:8080"

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: crop-maturity-frontend

    ports:
      - "80:80"

    depends_on:
      - backend

    restart: unless-stopped